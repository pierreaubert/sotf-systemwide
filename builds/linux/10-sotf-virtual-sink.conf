# SotF Virtual — systemwide capture sink.
#
# Installed by the SotF Systemwide installer (and provisioned by
# sotf-daemon itself on first start when missing). Creates a
# persistent null sink that applications play into; sotf-daemon
# captures its monitor, runs the plugin chain, and outputs to the
# real device selected in SotF. Select "SotF Virtual" as the system
# output in your sound settings after restarting PipeWire:
#   systemctl --user restart pipewire.service
#
# The marker line below identifies files written by the installer so
# uninstall can tell them from user-edited copies.
# sotf-virtual-sink: v1
#
# Multichannel: widen audio.position to your layout, e.g.
#   audio.position = [ FL FR FC LFE RL RR SL SR ]
# and restart PipeWire again.
context.objects = [
    { factory = adapter
      args = {
        factory.name = support.null-audio-sink
        node.name = "sotf-virtual"
        node.description = "SotF Virtual"
        media.class = Audio/Sink
        object.linger = true
        audio.position = [ FL FR ]
      }
    }
]
