[workspace]
members = [
    "crates/driver-common",
    "crates/driver-hal",
    "crates/daemon",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "System-wide audio capture, plugin-chain processing, and hardware output"
edition = "2024"
documentation = "https://github.com/pierreaubert/all_of_sotf"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/all_of_sotf"
keywords = ["audio", "dsp", "eq"]
categories = ["multimedia::audio"]
readme = "README.md"

[workspace.dependencies]
# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Async and system
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4.28"
memmap2 = "0.9"

# Crypto and encoding (driver-hal shared-memory handoff)
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.10.2"
bytemuck = { version = "1.14", features = ["derive"] }

# Test and QA
tempfile = "3.23"
insta = { version = "1.42", features = ["json"] }
serial_test = "3"
proptest = "1.9"

# Audio output
cpal = "0.17"

# macOS framework bindings
objc2-core-audio = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }

# SOTF crates live in the sibling `sotf` checkout (all_of_sotf layout).
# A standalone clone of this repo needs `../sotf` next to it.
sotf-engine = { path = "../sotf/crates/sotf-engine", default-features = false }
sotf-player = { path = "../sotf/crates/sotf-player" }
sotf-plugins = { path = "../sotf/crates/sotf-plugins", default-features = false }

# Local crates
driver-common = { path = "crates/driver-common" }
driver-hal = { path = "crates/driver-hal" }  # macOS only

[profile.dev]
opt-level = 1
split-debuginfo = "packed"
debug = 1
codegen-units = 256

[profile.release]
# Everyday optimised profile: thin LTO keeps cross-crate inlining without
# the serial bottleneck of fat LTO.
lto = "thin"
codegen-units = 14
panic = "unwind"

# `dist` is the "cut a release" profile. Artifacts land in `target/dist/`.
# Use via `cargo build --profile dist` — the Justfile `dist-*` recipes wrap
# this for the shipping binaries.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
