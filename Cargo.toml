[workspace]
members = [
    "crates/daemon",
]
resolver = "3"

[workspace.package]
version = "0.7.14"
authors = ["Pierre F. Aubert pierre@spinorama.org"]
description = "System-wide audio capture, plugin-chain processing, and hardware output"
edition = "2024"
documentation = "https://github.com/pierreaubert/all_of_sotf"
license = "GPL-3.0-or-later"
repository = "https://github.com/pierreaubert/all_of_sotf"
keywords = ["audio", "dsp", "eq"]
categories = ["multimedia::audio"]
readme = "README.md"

[workspace.dependencies]
# Serialization and data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Async and system
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
ctrlc = { version = "3.5", features = ["termination"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4.28"
memmap2 = "0.9.11"

# Crypto and encoding (driver-hal shared-memory handoff)
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.10.2"
bytemuck = { version = "1.14", features = ["derive"] }

# Test and QA
tempfile = "3.23"
insta = { version = "1.42", features = ["json"] }
serial_test = "4.0.1"
proptest = "1.9"

# Audio output
cpal = "0.17"

# macOS framework bindings
objc2-core-audio = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }

# SOTF crates live in the sibling `sotf` and `sotf-daw` checkouts
# (all_of_sotf layout). A standalone clone of this repo needs both next to it.
sotf-engine = { path = "../sotf-daw/crates/sotf-engine", default-features = false }
sotf-room-eq-graph = { path = "../sotf-daw/crates/sotf-room-eq-graph" }
sotf-plugins = { path = "../sotf-daw/crates/sotf-plugins", default-features = false }

# Driver transport lives in sotf-daw.
driver-common = { path = "../sotf-daw/crates/driver-common" }
driver-hal = { path = "../sotf-daw/crates/driver-hal" }  # macOS only

# DAW owns these forks; daemon and app resolve the same implementation.
[patch.crates-io]
rusty-fork = { git = "https://github.com/pierreaubert/rusty-fork.git", rev = "ee62bcd64fa6afe7fae0e52a448d716dc294e98d" }
fontconfig-parser = { git = "https://github.com/pierreaubert/fontconfig-parser.git", rev = "d247c91f5a57edd6ba6eb26e884d4904dbfbc87e" }
psm = { git = "https://github.com/pierreaubert/stacker.git", rev = "48bf8e3abfb350de9387a675275a629e4daf9717" }
nalgebra = { git = "https://github.com/pierreaubert/nalgebra.git", rev = "a42573dbc9649af62fb07b469c98c852e62720fd" }
block = { path = "../gpui-toolkit/crates/3rdparties/block" }
objc = { path = "../gpui-toolkit/crates/3rdparties/objc" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
nnnoiseless = { path = "../sotf-daw/crates/3rdparties/nnnoiseless" }
coreaudio-rs = { git = "https://github.com/pierreaubert/coreaudio-rs.git", rev = "29b0407363c479be0b7de681ba6ba050725a5174" }

[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { path = "../gpui-toolkit/crates/3rdparties/zed-font-kit" }

[workspace.lints.clippy]
perf = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1
split-debuginfo = "packed"
debug = 1
codegen-units = 256

[profile.release]
# Everyday optimised profile: thin LTO keeps cross-crate inlining without
# the serial bottleneck of fat LTO.
lto = "thin"
codegen-units = 14
panic = "unwind"

# `dist` is the "cut a release" profile. Artifacts land in `target/dist/`.
# Use via `cargo build --profile dist` — the Justfile `dist-*` recipes wrap
# this for the shipping binaries.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
